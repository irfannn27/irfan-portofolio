<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bg)" stroke="url(#border)" stroke-width="12" />

  <!-- Subtle glow aura inside -->
  <circle cx="256" cy="256" r="140" fill="#3b82f6" opacity="0.2" filter="url(#glow)" />

  <!-- Code Bracket & Text Content: <IPP/> -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', 'Poppins', monospace" font-weight="900" dominant-baseline="central">
    <text x="256" y="258" text-anchor="middle" font-size="112" letter-spacing="2">
      <tspan fill="#38bdf8">&lt;</tspan><tspan fill="url(#textGrad)">IPP</tspan><tspan fill="#38bdf8">/&gt;</tspan>
    </text>
  </g>
</svg>

